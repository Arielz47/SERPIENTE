<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de la Serpiente - Taller</title>
   <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <h1>🐍 Juego de la Serpiente</h1>
    <p class="descripcion">
      ¡Atrapa la comida azul, crece y suma puntos! Muévete con las flechas o los botones.
    </p>

    <section class="panel-info">
      <div class="tarjeta-info"><span>Puntaje</span><strong id="puntaje">0</strong></div>
      <div class="tarjeta-info">
        <span>Longitud</span>
        <strong id="cantidadPartes">0</strong>
      </div>
      <div class="tarjeta-info">
        <span>Estado</span>
        <strong id="estado">Parte 2</strong>
      </div>
    </section>

    <canvas id="canvasJuego" width="600" height="600" aria-label="Tablero de 600 por 600 píxeles, con 24 filas y 24 columnas">Su navegador no admite canvas.</canvas>

    <p class="leyenda">Cabeza amarilla · cuerpo rojo · comida azul</p>
    <section class="controles">
      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('arriba')" aria-label="Arriba">⬆️</button>
      <button class="vacio">-</button>

      <button onclick="cambiarDireccion('izquierda')" aria-label="Izquierda">⬅️</button>
      <button onclick="pausarJuego()" aria-label="Pausar">⏸️</button>
      <button onclick="cambiarDireccion('derecha')" aria-label="Derecha">➡️</button>

      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('abajo')" aria-label="Abajo">⬇️</button>
      <button class="vacio">-</button>
    </section>

    <section class="acciones">
      <button onclick="iniciarJuego()">Iniciar</button>
      <button class="secundario" onclick="reiniciarJuego()">Reiniciar</button>
    </section>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite">Taller: tablero de 600 × 600 px · celdas de 25 px · 24 filas y 24 columnas.</p>
  </main>

  <script src="serpiente.js"></script>
</body>
</html>
